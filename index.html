<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chiikawa 測驗計時器</title>
  <style>
    :root {
      --cream: #fff6f0;
      --peach: #ffd6c9;
      --pink: #ffb7c5;
      --mint: #c8f0e0;
      --sky: #cfe8ff;
      --lavender: #e8d5ff;
      --text: #5a4a4a;
      --muted: #9a8585;
      --card: #ffffffee;
      --accent: #ff8fab;
      --accent2: #7ec8b8;
      --warn: #e8a838;
      --danger: #e86a7a;
      --ok: #6cbc9a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang HK", "Hiragino Sans", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, var(--peach) 0 18%, transparent 19%),
        radial-gradient(circle at 88% 12%, var(--mint) 0 14%, transparent 15%),
        radial-gradient(circle at 78% 82%, var(--sky) 0 16%, transparent 17%),
        radial-gradient(circle at 18% 78%, var(--lavender) 0 12%, transparent 13%),
        linear-gradient(160deg, var(--cream), #ffe8ef 45%, #eaf7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-x: hidden;
    }
    .friends {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .buddy {
      position: absolute;
      width: 72px;
      height: 72px;
      opacity: 0.92;
      animation: floaty 4.5s ease-in-out infinite;
    }
    .buddy.b1 { left: 4%; top: 18%; animation-delay: 0s; }
    .buddy.b2 { right: 5%; top: 22%; animation-delay: 0.8s; }
    .buddy.b3 { left: 8%; bottom: 12%; animation-delay: 1.4s; }
    .buddy.b4 { right: 7%; bottom: 14%; animation-delay: 0.4s; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(920px, 100%);
      background: var(--card);
      border: 3px solid #fff;
      border-radius: 32px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow:
        0 18px 40px rgb(255 143 171 / 0.22),
        0 4px 0 #ffd0da;
      text-align: center;
      backdrop-filter: blur(6px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.55rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--peach), var(--mint));
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 0.3rem;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #d96b84;
    }
    .sub {
      margin: 0 0 1.2rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4rem, 16vw, 8.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.03em;
      margin: 0.35rem 0 1rem;
      color: #6b4f56;
      text-shadow: 0 3px 0 #ffe0e8;
      transition: color 0.25s ease;
    }
    .display.warn { color: var(--warn); text-shadow: 0 3px 0 #ffe8c2; }
    .display.danger { color: var(--danger); text-shadow: 0 3px 0 #ffd5db; }
    .display.done { color: var(--danger); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.03); }
    }
    .status {
      min-height: 1.5rem;
      margin-bottom: 1.25rem;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 700;
    }
    .status.warn { color: var(--warn); }
    .status.danger { color: var(--danger); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 1.1rem;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.35rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(180deg, #ff9eb3, var(--accent));
      box-shadow: 0 4px 0 #e97890;
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #e97890; }
    button.secondary {
      background: linear-gradient(180deg, #9fd9cb, var(--accent2));
      box-shadow: 0 4px 0 #5eaa98;
      color: #245449;
    }
    button.secondary:active { box-shadow: 0 2px 0 #5eaa98; }
    button.ghost {
      background: #fff;
      color: var(--muted);
      border: 2px solid #f0cfd8;
      box-shadow: 0 3px 0 #f0cfd8;
    }
    button.ghost:active { box-shadow: 0 1px 0 #f0cfd8; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .setup {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      align-items: center;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
    }
    .setup label { display: inline-flex; align-items: center; gap: 0.35rem; }
    .setup input[type="number"] {
      width: 3.6rem;
      padding: 0.4rem 0.45rem;
      border-radius: 12px;
      border: 2px solid #f0cfd8;
      background: #fffafb;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }
    .setup input[type="checkbox"] {
      width: 1.05rem;
      height: 1.05rem;
      accent-color: var(--accent);
    }
    .ended-banner {
      display: none;
      margin: 0 auto 0.9rem;
      padding: 0.7rem 1rem;
      border-radius: 16px;
      background: #ffe4ea;
      border: 2px solid #ffb7c5;
      color: #c24d63;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .ended-banner.show { display: block; }
    .paw {
      display: inline-block;
      margin: 0 0.15rem;
    }
  </style>
</head>
<body>
  <div class="friends" aria-hidden="true">
    <!-- Original cute blobs (inspired by soft kawaii vibe, not official art) -->
    <svg class="buddy b1" viewBox="0 0 80 80">
      <ellipse cx="40" cy="48" rx="28" ry="24" fill="#f7f1ea"/>
      <ellipse cx="40" cy="42" rx="24" ry="22" fill="#fff8f2"/>
      <circle cx="31" cy="42" r="3.2" fill="#5a4a4a"/>
      <circle cx="49" cy="42" r="3.2" fill="#5a4a4a"/>
      <path d="M35 50c2.5 3 7.5 3 10 0" stroke="#5a4a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="24" cy="48" rx="4" ry="3" fill="#ffc4c4" opacity=".7"/>
      <ellipse cx="56" cy="48" rx="4" ry="3" fill="#ffc4c4" opacity=".7"/>
      <ellipse cx="28" cy="24" rx="7" ry="9" fill="#fff8f2"/>
      <ellipse cx="52" cy="24" rx="7" ry="9" fill="#fff8f2"/>
    </svg>
    <svg class="buddy b2" viewBox="0 0 80 80">
      <ellipse cx="40" cy="46" rx="26" ry="24" fill="#d9f3ff"/>
      <ellipse cx="40" cy="42" rx="22" ry="20" fill="#eef9ff"/>
      <path d="M22 34c0-10 8-16 18-10" fill="#eef9ff"/>
      <path d="M58 34c0-10-8-16-18-10" fill="#eef9ff"/>
      <circle cx="32" cy="42" r="3" fill="#5a4a4a"/>
      <circle cx="48" cy="42" r="3" fill="#5a4a4a"/>
      <path d="M36 50c2 2.5 6 2.5 8 0" stroke="#5a4a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="34" y="54" width="12" height="7" rx="3" fill="#7ec8b8"/>
    </svg>
    <svg class="buddy b3" viewBox="0 0 80 80">
      <ellipse cx="40" cy="48" rx="24" ry="22" fill="#ffe6a8"/>
      <ellipse cx="40" cy="44" rx="20" ry="18" fill="#fff1c9"/>
      <ellipse cx="28" cy="22" rx="8" ry="12" fill="#fff1c9"/>
      <ellipse cx="52" cy="22" rx="8" ry="12" fill="#fff1c9"/>
      <circle cx="33" cy="44" r="2.8" fill="#5a4a4a"/>
      <circle cx="47" cy="44" r="2.8" fill="#5a4a4a"/>
      <circle cx="40" cy="50" r="2.2" fill="#ff9eb3"/>
      <path d="M34 54c3 2 9 2 12 0" stroke="#5a4a4a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <svg class="buddy b4" viewBox="0 0 80 80">
      <ellipse cx="40" cy="46" rx="27" ry="24" fill="#e8d5ff"/>
      <ellipse cx="40" cy="42" rx="23" ry="20" fill="#f4eaff"/>
      <circle cx="31" cy="41" r="3.1" fill="#5a4a4a"/>
      <circle cx="49" cy="41" r="3.1" fill="#5a4a4a"/>
      <path d="M35 49c2.8 3.2 7.2 3.2 10 0" stroke="#5a4a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M24 34c4-8 10-6 12-1" stroke="#f4eaff" stroke-width="8" stroke-linecap="round"/>
      <path d="M56 34c-4-8-10-6-12-1" stroke="#f4eaff" stroke-width="8" stroke-linecap="round"/>
    </svg>
  </div>

  <main class="wrap">
    <div class="badge"><span class="paw">♡</span> Chiikawa vibe 測驗計時<span class="paw">♡</span></div>
    <h1>測驗計時器</h1>
    <p class="sub">軟綿綿介面 · 可調時／分／秒 · 適合投影</p>
    <div id="ended" class="ended-banner" role="status">時間到！大家辛苦喇 ♡</div>
    <div id="time" class="display" aria-live="polite">15:00</div>
    <div id="status" class="status">準備開始</div>
    <div class="controls">
      <button id="startBtn" type="button">開始</button>
      <button id="pauseBtn" class="secondary" type="button" disabled>暫停</button>
      <button id="resetBtn" class="ghost" type="button">重設</button>
    </div>
    <div class="setup">
      <label>時 <input id="hours" type="number" min="0" max="23" value="0" /></label>
      <label>分 <input id="minutes" type="number" min="0" max="59" value="15" /></label>
      <label>秒 <input id="seconds" type="number" min="0" max="59" value="0" /></label>
      <label><input id="warn5" type="checkbox" checked /> 剩 5 分鐘提示</label>
      <label><input id="warn1" type="checkbox" checked /> 剩 1 分鐘提示</label>
      <label><input id="sound" type="checkbox" checked /> 結束鈴聲</label>
      <button id="testSoundBtn" class="ghost" type="button" style="padding:0.45rem 0.9rem;font-size:0.9rem">試鈴聲</button>
    </div>
  </main>
  <script>
    const timeEl = document.getElementById("time");
    const statusEl = document.getElementById("status");
    const endedEl = document.getElementById("ended");
    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const durationInputs = [hoursInput, minutesInput, secondsInput];
    const warn5 = document.getElementById("warn5");
    const warn1 = document.getElementById("warn1");
    const soundToggle = document.getElementById("sound");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let totalSeconds = 15 * 60;
    let remaining = totalSeconds;
    let timerId = null;
    let running = false;
    let warned5 = false;
    let warned1 = false;
    let audioCtx = null;

    function format(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      if (h > 0 || Number(hoursInput.value) > 0) {
        return String(h) + ":" + mm + ":" + ss;
      }
      return mm + ":" + ss;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function paint() {
      timeEl.textContent = format(remaining);
      timeEl.className = "display";
      if (remaining === 0) {
        timeEl.classList.add("done");
        return;
      }
      if (remaining <= 60) timeEl.classList.add("danger");
      else if (remaining <= 5 * 60) timeEl.classList.add("warn");
    }

    function getAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx || audioCtx.state === "closed") {
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = getAudio();
      if (!ctx) return;
      try {
        const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.start(0);
      } catch (_) {}
    }

    function beep(freq, durationMs, type, volume) {
      const ctx = getAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      const dur = Math.max(0.05, durationMs / 1000);
      const vol = volume == null ? 0.22 : volume;
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function endAlarm() {
      if (!soundToggle.checked) return;
      unlockAudio();
      const pattern = [
        [880, 220],
        [660, 220],
        [880, 280],
        [990, 360],
        [880, 420]
      ];
      let delay = 0;
      pattern.forEach(([freq, ms], i) => {
        setTimeout(() => beep(freq, ms, i % 2 ? "square" : "sawtooth", 0.28), delay);
        delay += ms + 80;
      });
    }

    function tick() {
      if (remaining <= 0) return;
      remaining -= 1;
      paint();

      if (warn5.checked && !warned5 && remaining === 5 * 60) {
        warned5 = true;
        setStatus("剩 5 分鐘 ♡", "warn");
        if (soundToggle.checked) beep(520, 160);
      } else if (warn1.checked && !warned1 && remaining === 60) {
        warned1 = true;
        setStatus("剩 1 分鐘！", "danger");
        if (soundToggle.checked) beep(700, 200);
      }

      if (remaining <= 0) {
        remaining = 0;
        stopTimer(true);
        endedEl.classList.add("show");
        setStatus("時間到", "danger");
        endAlarm();
      }
    }

    function stopTimer(ended) {
      running = false;
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.textContent = "暫停";
      durationInputs.forEach((el) => { el.disabled = false; });
      if (!ended) startBtn.textContent = remaining < totalSeconds ? "繼續" : "開始";
    }

    function startTimer() {
      if (running) return;
      unlockAudio();
      if (remaining <= 0) applyDuration(true);
      running = true;
      endedEl.classList.remove("show");
      durationInputs.forEach((el) => { el.disabled = true; });
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      pauseBtn.textContent = "暫停";
      startBtn.textContent = "開始";
      setStatus("計時中… 加油 ♡");
      paint();
      timerId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      if (!running) return;
      stopTimer(false);
      setStatus("已暫停");
    }

    function readDurationSeconds() {
      let h = Math.max(0, Math.min(23, Math.floor(Number(hoursInput.value) || 0)));
      let m = Math.max(0, Math.min(59, Math.floor(Number(minutesInput.value) || 0)));
      let s = Math.max(0, Math.min(59, Math.floor(Number(secondsInput.value) || 0)));
      let total = h * 3600 + m * 60 + s;
      if (total < 1) {
        m = 15;
        s = 0;
        h = 0;
        total = 15 * 60;
      }
      hoursInput.value = String(h);
      minutesInput.value = String(m);
      secondsInput.value = String(s);
      return total;
    }

    function applyDuration(force) {
      totalSeconds = readDurationSeconds();
      if (force || !running) {
        remaining = totalSeconds;
        warned5 = false;
        warned1 = false;
        endedEl.classList.remove("show");
        paint();
        setStatus("準備開始");
        startBtn.textContent = "開始";
      }
    }

    function resetTimer() {
      stopTimer(false);
      applyDuration(true);
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
    document.getElementById("testSoundBtn").addEventListener("click", () => {
      unlockAudio();
      endAlarm();
    });
    durationInputs.forEach((el) => {
      el.addEventListener("change", () => {
        if (!running) applyDuration(true);
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input")) return;
      if (e.code === "Space") {
        e.preventDefault();
        running ? pauseTimer() : startTimer();
      } else if (e.key.toLowerCase() === "r") {
        resetTimer();
      }
    });

    applyDuration(true);
  </script>
</body>
</html>
