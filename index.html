<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天空測驗計時器</title>
  <style>
    :root {
      --sky-deep: #0b3a6e;
      --sky-mid: #2a7ec4;
      --sky-light: #8ec8f0;
      --gold: #f0c878;
      --gold-soft: #ffe6b0;
      --pink-rim: #ffb8c8;
      --text: #0f2a4a;
      --text-bright: #ffffff;
      --muted: #4a6a8a;
      --glass: rgb(255 255 255 / 0.22);
      --glass-strong: rgb(255 255 255 / 0.38);
      --glass-border: rgb(255 255 255 / 0.55);
      --accent: #3a8fd4;
      --accent2: #5aa8e0;
      --warn: #e8a020;
      --danger: #e84858;
      --ok: #3cb89a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang HK", "Hiragino Sans", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      /* Drop-in hook: prefer local sky photo; CSS sky underneath as fallback */
      background-color: #1a5a9a;
      background-image:
        linear-gradient(
          180deg,
          rgb(8 40 90 / 0.35) 0%,
          rgb(40 100 180 / 0.15) 40%,
          rgb(255 180 140 / 0.25) 100%
        ),
        url("bg-sky.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-x: hidden;
      position: relative;
    }
    /* Soft light rays / luminous haze (CSS-only Shinkai accent over the photo) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 70% 15%, rgb(255 230 180 / 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgb(255 160 180 / 0.18) 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 85% 70%, rgb(120 200 255 / 0.2) 0%, transparent 45%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: repeating-linear-gradient(
        105deg,
        transparent 0,
        transparent 40px,
        rgb(255 255 255 / 0.03) 40px,
        rgb(255 255 255 / 0.06) 42px,
        transparent 44px,
        transparent 90px
      );
      opacity: 0.7;
      mix-blend-mode: soft-light;
    }
    .sky-clouds {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      border-radius: 50%;
      background: rgb(255 255 255 / 0.12);
      filter: blur(28px);
      animation: drift 28s ease-in-out infinite;
    }
    .cloud.c1 { width: 280px; height: 90px; left: 8%; top: 12%; animation-delay: 0s; }
    .cloud.c2 { width: 360px; height: 110px; right: 5%; top: 22%; animation-delay: -8s; opacity: 0.7; }
    .cloud.c3 { width: 220px; height: 70px; left: 35%; bottom: 18%; animation-delay: -14s; opacity: 0.55; }
    @keyframes drift {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(24px) translateY(-8px); }
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(920px, 100%);
      background: var(--glass-strong);
      border: 1.5px solid var(--glass-border);
      border-radius: 28px;
      padding: 1.85rem 1.6rem 1.55rem;
      box-shadow:
        0 24px 60px rgb(8 40 90 / 0.35),
        0 0 0 1px rgb(255 255 255 / 0.15) inset,
        0 1px 0 rgb(255 255 255 / 0.45) inset;
      text-align: center;
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.55rem;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      background: linear-gradient(90deg, rgb(255 220 160 / 0.55), rgb(160 210 255 / 0.55));
      border: 1px solid rgb(255 255 255 / 0.5);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 0 rgb(255 255 255 / 0.5);
    }
    h1 {
      margin: 0 0 0.3rem;
      font-size: clamp(1.4rem, 3.2vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text-bright);
      text-shadow:
        0 2px 12px rgb(8 40 90 / 0.55),
        0 0 40px rgb(255 200 120 / 0.35);
    }
    .sub {
      margin: 0 0 1.2rem;
      color: rgb(240 248 255 / 0.88);
      font-size: 0.95rem;
      text-shadow: 0 1px 6px rgb(8 40 90 / 0.45);
    }
    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4.2rem, 17vw, 8.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.04em;
      margin: 0.35rem 0 1rem;
      color: #ffffff;
      text-shadow:
        0 2px 0 rgb(8 40 90 / 0.35),
        0 4px 24px rgb(8 40 90 / 0.55),
        0 0 48px rgb(100 180 255 / 0.35);
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }
    .display.warn {
      color: #ffe08a;
      text-shadow:
        0 2px 0 rgb(100 60 0 / 0.35),
        0 4px 24px rgb(200 120 0 / 0.5),
        0 0 40px rgb(255 200 80 / 0.45);
    }
    .display.danger {
      color: #ff8a9a;
      text-shadow:
        0 2px 0 rgb(80 10 20 / 0.4),
        0 4px 24px rgb(200 40 60 / 0.55),
        0 0 40px rgb(255 100 120 / 0.4);
    }
    .display.done {
      color: #ff6a7a;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.03); }
    }
    .status {
      min-height: 1.5rem;
      margin-bottom: 1.25rem;
      color: rgb(230 242 255 / 0.9);
      font-size: 1.05rem;
      font-weight: 700;
      text-shadow: 0 1px 8px rgb(8 40 90 / 0.5);
    }
    .status.warn { color: #ffe08a; }
    .status.danger { color: #ff9aaa; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 1.1rem;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(180deg, #5eb0f0, #2a7ec4);
      box-shadow:
        0 4px 0 #1a5a9a,
        0 8px 20px rgb(20 80 140 / 0.35);
      border: 1px solid rgb(255 255 255 / 0.35);
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a5a9a, 0 4px 12px rgb(20 80 140 / 0.3); }
    button.secondary {
      background: linear-gradient(180deg, #7ec8e8, #4a9cc8);
      box-shadow: 0 4px 0 #2a6a90, 0 8px 20px rgb(20 80 140 / 0.28);
      color: #0a3050;
    }
    button.secondary:active { box-shadow: 0 2px 0 #2a6a90, 0 4px 12px rgb(20 80 140 / 0.25); }
    button.ghost {
      background: rgb(255 255 255 / 0.28);
      color: #0f2a4a;
      border: 1.5px solid rgb(255 255 255 / 0.55);
      box-shadow: 0 3px 0 rgb(255 255 255 / 0.2), 0 6px 16px rgb(8 40 90 / 0.2);
      backdrop-filter: blur(8px);
    }
    button.ghost:active { box-shadow: 0 1px 0 rgb(255 255 255 / 0.2); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .setup {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      align-items: center;
      margin-top: 0.35rem;
      color: rgb(240 248 255 / 0.92);
      font-size: 0.95rem;
      font-weight: 600;
      text-shadow: 0 1px 6px rgb(8 40 90 / 0.4);
    }
    .setup label { display: inline-flex; align-items: center; gap: 0.35rem; }
    .setup input[type="number"] {
      width: 3.6rem;
      padding: 0.4rem 0.45rem;
      border-radius: 12px;
      border: 1.5px solid rgb(255 255 255 / 0.5);
      background: rgb(255 255 255 / 0.55);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      backdrop-filter: blur(6px);
    }
    .setup input[type="checkbox"] {
      width: 1.05rem;
      height: 1.05rem;
      accent-color: var(--accent);
    }
    .ended-banner {
      display: none;
      margin: 0 auto 0.9rem;
      padding: 0.7rem 1rem;
      border-radius: 16px;
      background: rgb(255 100 120 / 0.35);
      border: 1.5px solid rgb(255 180 190 / 0.65);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      text-shadow: 0 1px 8px rgb(80 10 20 / 0.5);
      backdrop-filter: blur(8px);
    }
    .ended-banner.show { display: block; }
  </style>
</head>
<body>
  <!-- Soft cloud haze over bg-sky.jpg (CSS-only; no character art) -->
  <div class="sky-clouds" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <main class="wrap">
    <div class="badge">✦ 天空光影 · 課堂計時</div>
    <h1>天空測驗計時器</h1>
    <p class="sub">可調時／分／秒 · 適合投影</p>
    <div id="ended" class="ended-banner" role="status">時間到！大家辛苦了</div>
    <div id="time" class="display" aria-live="polite">15:00</div>
    <div id="status" class="status">準備開始</div>
    <div class="controls">
      <button id="startBtn" type="button">開始</button>
      <button id="pauseBtn" class="secondary" type="button" disabled>暫停</button>
      <button id="resetBtn" class="ghost" type="button">重設</button>
    </div>
    <div class="setup">
      <label>時 <input id="hours" type="number" min="0" max="23" value="0" /></label>
      <label>分 <input id="minutes" type="number" min="0" max="59" value="15" /></label>
      <label>秒 <input id="seconds" type="number" min="0" max="59" value="0" /></label>
      <label><input id="warn5" type="checkbox" checked /> 剩 5 分鐘提示</label>
      <label><input id="warn1" type="checkbox" checked /> 剩 1 分鐘提示</label>
      <label><input id="sound" type="checkbox" checked /> 結束鈴聲</label>
      <button id="testSoundBtn" class="ghost" type="button" style="padding:0.45rem 0.9rem;font-size:0.9rem">試鈴聲</button>
    </div>
  </main>
  <script>
    const timeEl = document.getElementById("time");
    const statusEl = document.getElementById("status");
    const endedEl = document.getElementById("ended");
    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const durationInputs = [hoursInput, minutesInput, secondsInput];
    const warn5 = document.getElementById("warn5");
    const warn1 = document.getElementById("warn1");
    const soundToggle = document.getElementById("sound");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let totalSeconds = 15 * 60;
    let remaining = totalSeconds;
    let timerId = null;
    let running = false;
    let warned5 = false;
    let warned1 = false;
    let audioCtx = null;

    function format(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      if (h > 0 || Number(hoursInput.value) > 0) {
        return String(h) + ":" + mm + ":" + ss;
      }
      return mm + ":" + ss;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function paint() {
      timeEl.textContent = format(remaining);
      timeEl.className = "display";
      if (remaining === 0) {
        timeEl.classList.add("done");
        return;
      }
      if (remaining <= 60) timeEl.classList.add("danger");
      else if (remaining <= 5 * 60) timeEl.classList.add("warn");
    }

    function getAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx || audioCtx.state === "closed") {
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = getAudio();
      if (!ctx) return;
      try {
        const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.start(0);
      } catch (_) {}
    }

    function beep(freq, durationMs, type, volume) {
      const ctx = getAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      const dur = Math.max(0.05, durationMs / 1000);
      const vol = volume == null ? 0.22 : volume;
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function endAlarm() {
      if (!soundToggle.checked) return;
      unlockAudio();
      const pattern = [
        [880, 220],
        [660, 220],
        [880, 280],
        [990, 360],
        [880, 420]
      ];
      let delay = 0;
      pattern.forEach(([freq, ms], i) => {
        setTimeout(() => beep(freq, ms, i % 2 ? "square" : "sawtooth", 0.28), delay);
        delay += ms + 80;
      });
    }

    function tick() {
      if (remaining <= 0) return;
      remaining -= 1;
      paint();

      if (warn5.checked && !warned5 && remaining === 5 * 60) {
        warned5 = true;
        setStatus("剩 5 分鐘", "warn");
        if (soundToggle.checked) beep(520, 160);
      } else if (warn1.checked && !warned1 && remaining === 60) {
        warned1 = true;
        setStatus("剩 1 分鐘！", "danger");
        if (soundToggle.checked) beep(700, 200);
      }

      if (remaining <= 0) {
        remaining = 0;
        stopTimer(true);
        endedEl.classList.add("show");
        setStatus("時間到", "danger");
        endAlarm();
      }
    }

    function stopTimer(ended) {
      running = false;
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.textContent = "暫停";
      durationInputs.forEach((el) => { el.disabled = false; });
      if (!ended) startBtn.textContent = remaining < totalSeconds ? "繼續" : "開始";
    }

    function startTimer() {
      if (running) return;
      unlockAudio();
      if (remaining <= 0) applyDuration(true);
      running = true;
      endedEl.classList.remove("show");
      durationInputs.forEach((el) => { el.disabled = true; });
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      pauseBtn.textContent = "暫停";
      startBtn.textContent = "開始";
      setStatus("計時中…");
      paint();
      timerId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      if (!running) return;
      stopTimer(false);
      setStatus("已暫停");
    }

    function readDurationSeconds() {
      let h = Math.max(0, Math.min(23, Math.floor(Number(hoursInput.value) || 0)));
      let m = Math.max(0, Math.min(59, Math.floor(Number(minutesInput.value) || 0)));
      let s = Math.max(0, Math.min(59, Math.floor(Number(secondsInput.value) || 0)));
      let total = h * 3600 + m * 60 + s;
      if (total < 1) {
        m = 15;
        s = 0;
        h = 0;
        total = 15 * 60;
      }
      hoursInput.value = String(h);
      minutesInput.value = String(m);
      secondsInput.value = String(s);
      return total;
    }

    function applyDuration(force) {
      totalSeconds = readDurationSeconds();
      if (force || !running) {
        remaining = totalSeconds;
        warned5 = false;
        warned1 = false;
        endedEl.classList.remove("show");
        paint();
        setStatus("準備開始");
        startBtn.textContent = "開始";
      }
    }

    function resetTimer() {
      stopTimer(false);
      applyDuration(true);
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
    document.getElementById("testSoundBtn").addEventListener("click", () => {
      unlockAudio();
      endAlarm();
    });
    durationInputs.forEach((el) => {
      el.addEventListener("change", () => {
        if (!running) applyDuration(true);
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input")) return;
      if (e.code === "Space") {
        e.preventDefault();
        running ? pauseTimer() : startTimer();
      } else if (e.key.toLowerCase() === "r") {
        resetTimer();
      }
    });

    applyDuration(true);
  </script>
</body>
</html>
