<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>測驗計時器</title>
  <style>
    :root {
      --text: #0f2a4a;
      --accent: #2a7ec4;
      --warn: #e8a020;
      --danger: #e84858;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang HK", "Hiragino Sans", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background-color: #1a5a9a;
      background-image:
        linear-gradient(
          180deg,
          rgb(8 40 90 / 0.4) 0%,
          rgb(40 100 180 / 0.2) 45%,
          rgb(255 160 120 / 0.28) 100%
        ),
        url("bg-sky.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      background: rgb(12 40 78 / 0.78);
      border: 2px solid rgb(255 255 255 / 0.35);
      border-radius: 20px;
      padding: 1.5rem 1.4rem 1.35rem;
      box-shadow: 0 16px 40px rgb(0 20 50 / 0.45);
      text-align: center;
    }
    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(5.5rem, 22vw, 11rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.04em;
      margin: 0.2rem 0 0.85rem;
      color: #ffffff;
      text-shadow:
        0 3px 0 rgb(0 20 50 / 0.45),
        0 6px 28px rgb(0 20 50 / 0.55);
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }
    .display.warn {
      color: #ffe08a;
      text-shadow:
        0 3px 0 rgb(80 50 0 / 0.4),
        0 6px 28px rgb(180 100 0 / 0.5);
    }
    .display.danger {
      color: #ff8a9a;
      text-shadow:
        0 3px 0 rgb(70 10 20 / 0.45),
        0 6px 28px rgb(180 30 50 / 0.55);
    }
    .display.done {
      color: #ff6a7a;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.03); }
    }
    .status {
      min-height: 1.4rem;
      margin-bottom: 1.1rem;
      color: rgb(230 242 255 / 0.95);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .status.warn { color: #ffe08a; }
    .status.danger { color: #ff9aaa; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(180deg, #5eb0f0, #2a7ec4);
      box-shadow: 0 4px 0 #1a5a9a;
      border: 1px solid rgb(255 255 255 / 0.3);
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a5a9a; }
    button.secondary {
      background: linear-gradient(180deg, #7ec8e8, #4a9cc8);
      box-shadow: 0 4px 0 #2a6a90;
      color: #0a3050;
    }
    button.secondary:active { box-shadow: 0 2px 0 #2a6a90; }
    button.ghost {
      background: rgb(255 255 255 / 0.92);
      color: #0f2a4a;
      border: 1.5px solid rgb(200 220 240 / 0.9);
      box-shadow: 0 3px 0 rgb(160 190 220 / 0.7);
    }
    button.ghost:active { box-shadow: 0 1px 0 rgb(160 190 220 / 0.7); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .setup {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      align-items: center;
      color: rgb(240 248 255 / 0.95);
      font-size: 0.95rem;
      font-weight: 600;
    }
    .setup label { display: inline-flex; align-items: center; gap: 0.35rem; }
    .setup input[type="number"] {
      width: 3.6rem;
      padding: 0.4rem 0.45rem;
      border-radius: 10px;
      border: 1.5px solid rgb(200 220 240);
      background: #ffffff;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }
    .setup input[type="checkbox"] {
      width: 1.05rem;
      height: 1.05rem;
      accent-color: var(--accent);
    }
    .ended-banner {
      display: none;
      margin: 0 auto 0.85rem;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      background: rgb(200 40 60 / 0.85);
      border: 2px solid rgb(255 180 190);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
    }
    .ended-banner.show { display: block; }
  </style>
</head>
<body>
  <main class="wrap">
    <div id="ended" class="ended-banner" role="status">時間到！大家辛苦了</div>
    <div id="time" class="display" aria-live="polite">15:00</div>
    <div id="status" class="status">準備開始</div>
    <div class="controls">
      <button id="startBtn" type="button">開始</button>
      <button id="pauseBtn" class="secondary" type="button" disabled>暫停</button>
      <button id="resetBtn" class="ghost" type="button">重設</button>
    </div>
    <div class="setup">
      <label>時 <input id="hours" type="number" min="0" max="23" value="0" /></label>
      <label>分 <input id="minutes" type="number" min="0" max="59" value="15" /></label>
      <label>秒 <input id="seconds" type="number" min="0" max="59" value="0" /></label>
      <label><input id="warn5" type="checkbox" checked /> 剩 5 分鐘提示</label>
      <label><input id="warn1" type="checkbox" checked /> 剩 1 分鐘提示</label>
      <label><input id="sound" type="checkbox" checked /> 結束鈴聲</label>
      <button id="testSoundBtn" class="ghost" type="button" style="padding:0.45rem 0.9rem;font-size:0.9rem">試鈴聲</button>
    </div>
  </main>
  <script>
    const timeEl = document.getElementById("time");
    const statusEl = document.getElementById("status");
    const endedEl = document.getElementById("ended");
    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const durationInputs = [hoursInput, minutesInput, secondsInput];
    const warn5 = document.getElementById("warn5");
    const warn1 = document.getElementById("warn1");
    const soundToggle = document.getElementById("sound");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let totalSeconds = 15 * 60;
    let remaining = totalSeconds;
    let timerId = null;
    let running = false;
    let warned5 = false;
    let warned1 = false;
    let audioCtx = null;

    function format(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      if (h > 0 || Number(hoursInput.value) > 0) {
        return String(h) + ":" + mm + ":" + ss;
      }
      return mm + ":" + ss;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function paint() {
      timeEl.textContent = format(remaining);
      timeEl.className = "display";
      if (remaining === 0) {
        timeEl.classList.add("done");
        return;
      }
      if (remaining <= 60) timeEl.classList.add("danger");
      else if (remaining <= 5 * 60) timeEl.classList.add("warn");
    }

    function getAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx || audioCtx.state === "closed") {
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = getAudio();
      if (!ctx) return;
      try {
        const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.start(0);
      } catch (_) {}
    }

    function beep(freq, durationMs, type, volume) {
      const ctx = getAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      const dur = Math.max(0.05, durationMs / 1000);
      const vol = volume == null ? 0.22 : volume;
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function endAlarm() {
      if (!soundToggle.checked) return;
      unlockAudio();
      const pattern = [
        [880, 220],
        [660, 220],
        [880, 280],
        [990, 360],
        [880, 420]
      ];
      let delay = 0;
      pattern.forEach(([freq, ms], i) => {
        setTimeout(() => beep(freq, ms, i % 2 ? "square" : "sawtooth", 0.28), delay);
        delay += ms + 80;
      });
    }

    function tick() {
      if (remaining <= 0) return;
      remaining -= 1;
      paint();

      if (warn5.checked && !warned5 && remaining === 5 * 60) {
        warned5 = true;
        setStatus("剩 5 分鐘", "warn");
        if (soundToggle.checked) beep(520, 160);
      } else if (warn1.checked && !warned1 && remaining === 60) {
        warned1 = true;
        setStatus("剩 1 分鐘！", "danger");
        if (soundToggle.checked) beep(700, 200);
      }

      if (remaining <= 0) {
        remaining = 0;
        stopTimer(true);
        endedEl.classList.add("show");
        setStatus("時間到", "danger");
        endAlarm();
      }
    }

    function stopTimer(ended) {
      running = false;
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.textContent = "暫停";
      durationInputs.forEach((el) => { el.disabled = false; });
      if (!ended) startBtn.textContent = remaining < totalSeconds ? "繼續" : "開始";
    }

    function startTimer() {
      if (running) return;
      unlockAudio();
      if (remaining <= 0) applyDuration(true);
      running = true;
      endedEl.classList.remove("show");
      durationInputs.forEach((el) => { el.disabled = true; });
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      pauseBtn.textContent = "暫停";
      startBtn.textContent = "開始";
      setStatus("計時中…");
      paint();
      timerId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      if (!running) return;
      stopTimer(false);
      setStatus("已暫停");
    }

    function readDurationSeconds() {
      let h = Math.max(0, Math.min(23, Math.floor(Number(hoursInput.value) || 0)));
      let m = Math.max(0, Math.min(59, Math.floor(Number(minutesInput.value) || 0)));
      let s = Math.max(0, Math.min(59, Math.floor(Number(secondsInput.value) || 0)));
      let total = h * 3600 + m * 60 + s;
      if (total < 1) {
        m = 15;
        s = 0;
        h = 0;
        total = 15 * 60;
      }
      hoursInput.value = String(h);
      minutesInput.value = String(m);
      secondsInput.value = String(s);
      return total;
    }

    function applyDuration(force) {
      totalSeconds = readDurationSeconds();
      if (force || !running) {
        remaining = totalSeconds;
        warned5 = false;
        warned1 = false;
        endedEl.classList.remove("show");
        paint();
        setStatus("準備開始");
        startBtn.textContent = "開始";
      }
    }

    function resetTimer() {
      stopTimer(false);
      applyDuration(true);
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
    document.getElementById("testSoundBtn").addEventListener("click", () => {
      unlockAudio();
      endAlarm();
    });
    durationInputs.forEach((el) => {
      el.addEventListener("change", () => {
        if (!running) applyDuration(true);
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input")) return;
      if (e.code === "Space") {
        e.preventDefault();
        running ? pauseTimer() : startTimer();
      } else if (e.key.toLowerCase() === "r") {
        resetTimer();
      }
    });

    applyDuration(true);
  </script>
</body>
</html>
